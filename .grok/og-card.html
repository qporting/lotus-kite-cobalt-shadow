<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
@font-face {
  font-family: "LibSerif";
  src: url("file:///usr/share/fonts/truetype/liberation/LiberationSerif-Bold.ttf") format("truetype");
  font-weight: 700;
}
@font-face {
  font-family: "LibSans";
  src: url("file:///usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf") format("truetype");
  font-weight: 400;
}
html, body {
  margin: 0;
  padding: 0;
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: #f3efe6;
}
.stage {
  position: relative;
  width: 1200px;
  height: 630px;
  background:
    radial-gradient(1200px 700px at 50% 42%, #faf7f0 0%, #f3efe6 58%, #e6dfd0 100%);
}
.grain {
  position: absolute;
  inset: 0;
  background: url("og-grain.png") center / cover;
  opacity: 0.14;
  mix-blend-mode: multiply;
  pointer-events: none;
}
.frame {
  position: absolute;
  inset: 36px;
  border: 2px solid #2f5d50;
  border-radius: 8px;
  opacity: 0.55;
}
.frame-inner {
  position: absolute;
  inset: 44px;
  border: 1px solid #2f5d50;
  border-radius: 4px;
  opacity: 0.28;
}
.card {
  position: absolute;
  left: 180px;
  top: 92px;
  width: 840px;
  height: 446px;
  background: #faf7f0;
  border-radius: 22px;
  box-shadow: 0 18px 40px rgba(26, 24, 20, 0.08);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
}
.mark {
  width: 56px;
  height: 56px;
}
.title {
  margin: 0;
  padding: 0 72px;
  text-align: center;
  color: #1a1814;
  font-family: "LibSerif", "Liberation Serif", Georgia, serif;
  font-weight: 700;
  font-size: 64px;
  line-height: 1.08;
  letter-spacing: 0.04em;
}
.rule {
  width: 88px;
  height: 2px;
  background: #2f5d50;
  opacity: 0.7;
}
.tag {
  margin: 0;
  color: #2f5d50;
  font-family: "LibSans", "Liberation Sans", sans-serif;
  font-size: 18px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}
.prop {
  position: absolute;
  color: #2f5d50;
  opacity: 0.55;
}
.prop.mug { left: 64px; top: 198px; }
.prop.plant { right: 58px; top: 168px; }
.prop.glasses { left: 88px; bottom: 78px; }
.prop.keys { right: 86px; bottom: 86px; }
</style>
</head>
<body>
<div class="stage">
  <div class="grain"></div>
  <div class="frame"></div>
  <div class="frame-inner"></div>

  <svg class="prop mug" width="72" height="78" viewBox="0 0 72 78" fill="none" aria-hidden="true">
    <rect x="8" y="14" width="42" height="50" rx="8" stroke="#2f5d50" stroke-width="3.2"/>
    <path d="M50 26c12 2 16 12 12 22-3 8-12 12-20 10" stroke="#2f5d50" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M16 8c6 6 20 6 26 0" stroke="#2f5d50" stroke-width="2.4" stroke-linecap="round"/>
  </svg>

  <svg class="prop plant" width="86" height="110" viewBox="0 0 86 110" fill="none" aria-hidden="true">
    <path d="M43 108V48" stroke="#2f5d50" stroke-width="3" stroke-linecap="round"/>
    <path d="M43 78c-16-4-26-20-22-36 14 4 22 16 22 36Z" fill="#2f5d50"/>
    <path d="M43 70c16-2 28-16 26-34-16 2-24 16-26 34Z" fill="#2f5d50"/>
    <path d="M43 54c-8-14-4-30 8-38-2 16 0 28-8 38Z" fill="#2f5d50"/>
    <rect x="28" y="96" width="30" height="12" rx="3" fill="#2f5d50"/>
  </svg>

  <svg class="prop glasses" width="110" height="42" viewBox="0 0 110 42" fill="none" aria-hidden="true">
    <circle cx="32" cy="24" r="16" stroke="#1a1814" stroke-width="3"/>
    <circle cx="78" cy="24" r="16" stroke="#1a1814" stroke-width="3"/>
    <path d="M48 24h12" stroke="#1a1814" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 20L4 12" stroke="#1a1814" stroke-width="3" stroke-linecap="round"/>
    <path d="M94 20l12-8" stroke="#1a1814" stroke-width="3" stroke-linecap="round"/>
  </svg>

  <svg class="prop keys" width="78" height="40" viewBox="0 0 78 40" fill="none" aria-hidden="true">
    <circle cx="14" cy="20" r="9" stroke="#2f5d50" stroke-width="3.4"/>
    <path d="M23 20h46" stroke="#2f5d50" stroke-width="4" stroke-linecap="round"/>
    <path d="M52 20v12M62 20v8" stroke="#2f5d50" stroke-width="3.4" stroke-linecap="round"/>
  </svg>

  <div class="card">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="#2f5d50"/>
      <circle cx="11" cy="16" r="5.25" fill="none" stroke="#faf7f0" stroke-width="3"/>
      <rect x="15.5" y="14.4" width="11.2" height="3.2" rx="1.4" fill="#faf7f0"/>
      <rect x="21.6" y="17.4" width="2.2" height="4.6" rx="0.7" fill="#faf7f0"/>
      <rect x="24.8" y="17.4" width="2.2" height="3.2" rx="0.7" fill="#faf7f0"/>
    </svg>
    <h1 class="title">WHERE DID I<br>PUT THAT?</h1>
    <div class="rule"></div>
    <p class="tag">a quiet home for lost things</p>
  </div>
</div>
</body>
</html>
